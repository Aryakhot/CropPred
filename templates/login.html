<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <!-- <link rel="stylesheet" href="styles.css"> -->
    <style>
        *{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}



body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-image: url("{{ url_for('static', filename='images/c1.avif') }}");
            background-size: cover;
            background-position: center;
        }

        .logo {
            display: flex;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            color: white;
        }
        .logo img {
            width: 50px; /* Adjust logo size */
            height: auto;
            margin-right: 10px;
        }
        
        .content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Contact Us Form Styling */
        .content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .form-container {
            background-color: rgba(0, 0, 0, 0.7);
            padding: 30px;
            border-radius: 10px;
            color: white;
            width: 400px;
        }

        .form-container h2 {
            text-align: center;
            margin-bottom: 20px;
            font-family: 'Montserrat', sans-serif;
        }

        .form-container input, .form-container textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
            background-color: rgba(255, 255, 255, 0.9);
            color: #333;
        }

        .form-container button {
            background-color: #4CAF50;
            color: white;
            padding: 12px;
            width: 100%;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .form-container button:hover {
            background-color: #45a049;
        }

        
        #home {
    color: white;
    text-decoration: none;
    padding: 10px 15px;
    padding-left: 650px;
    transition: color 0.3s;
    font-family: 'Montserrat', sans-serif;
    font-size: 18px;
    text-transform: uppercase;
}
#contact {color: white;
    text-decoration: none;
    padding: 10px 15px;
    transition: color 0.3s;
    font-family: 'Montserrat', sans-serif;
    font-size: 18px;
    text-transform: uppercase;

}

#login {color: white;
    text-decoration: none;
    padding: 10px 15px;
    transition: color 0.3s;
    font-family: 'Montserrat', sans-serif;
    font-size: 18px;
    text-transform: uppercase;


}

#logout {color: white;
    text-decoration: none;
    padding: 10px 15px;
    transition: color 0.3s;
    font-family: 'Montserrat', sans-serif;
    font-size: 18px;
    text-transform: uppercase;

}
.top-left-logo {
    position: absolute;
    top: 20px;
    left: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.top-left-logo img {
    width: 100px; /* Adjust size as needed */
    margin: 10px;
    margin-top:0px;
}

.top-left-logo span {
    font-size: 20px;
    font-weight: bold;
    color: #333;
}


.background {
    background-image: url('c1.avif'); /* Replace 'background.jpg' with your image path */
    background-size: cover;
    background-position: center;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
}

.login-form {
    background-color: rgba(255, 255, 255, 0.8); /* Slightly transparent white background */
    padding: 20px;
    border-radius: 8px;
    text-align: center;
    width: 300px;
}

.login-form h2 {
    margin-bottom: 20px;
    color: #333;
}

.login-form input {
    width: 100%;
    padding: 10px;
    margin: 10px 0;
    border: 1px solid #ccc;
    border-radius: 4px;
}

.login-form button {
    width: 100%;
    padding: 10px;
    background-color: #4CAF50; /* Green color */
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
}

.login-form button:hover {
    background-color: #45a049;
}

.create-account {
    margin-top: 15px;
    color: #555;
}

.create-account a {
    color: #4CAF50;
    text-decoration: none;
}

.create-account a:hover {
    text-decoration: underline;
}

    </style>
</head>
<body>
        <!-- Navigation Bar -->
        <nav>
            <div class="nav-content">
                <div class="logo">
                    <img src="{{ url_for('static', filename='images/logo.webp') }}" alt="Agro Connect Logo"> <!-- Logo Image -->
                    AGRO-CONNECT
                </div>
                
        </nav>

    <div class="background">
        <div class="login-form">
            <h2>Login</h2>
            <form action="/login" method="POST">
                <input type="text" name="username" placeholder="Username" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit">Login</button>
                <p class="create-account">Don't have an account? <a href="/registration_form">Create Account</a></p>
            </form>
        </div>
    </div>
     <!-- Google Translate -->
 <div class="gtranslate_wrapper"></div>

 <script>
   window.gtranslateSettings = {
     default_language: "en",
     detect_browser_language: true,
     wrapper_selector: ".gtranslate_wrapper",
   };
 </script>

 <script
   src="https://cdn.gtranslate.net/widgets/latest/float.js"
   defer
 ></script>
</body>
</html>
