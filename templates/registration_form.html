<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agro Connect - Create Account</title>
    <link rel="stylesheet" href="style.css">

    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body, html {
    height: 100%;
}

/* Container for layout */
.container {
    display: flex;
    height: 100vh;
}

/* Left section with image */
.image-section {
    flex: 1;
    background-color: #f0f0f0;
}

.image-section img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* Right section with form */
.form-section {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 40px;
    background-color: #ffffff;
}

.form-section h2 {
    margin-bottom: 20px;
    color: #333;
}

.form-group {
    margin-bottom: 15px;
    width: 500px;
}

.form-group label {
    display: block;
    margin-bottom: 5px;
    font-size: 14px;
    color: #333;
}

.form-group input {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 4px;
}

.button-group {
    display: flex;
    justify-content: center;
    gap: 20px; /* Space between the buttons */
    margin-top: 20px;
}

.button-group button {
    width: auto;
    padding: 10px 20px;
    background-color: #4CAF50;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
}

.button-group button:hover {
    background-color: #45a049;
}
nav {
            width: 1500px;
  position: absolute;
            top: 0px;
            left: 0px;
            right: 0;
            height: 100px;

        }
      
        nav a {
            text-decoration: none;
            color: #fffffff6; /* Match link color with button */
            font-size: 20px;
        }
        nav a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>


    <div class="container">
        <!-- Left side with image -->
        <div class="image-section">
            <img src="{{ url_for('static', filename='images/premium_photo-1661757549432-446331f0fd6c.avif') }}" alt="Create Account Image"> <!-- Replace with your image path -->
        </div>


        <!-- Right side with form -->
        <div class="form-section">
            <h2>Create an Account</h2>
            <form action="registration_form" method="POST">
                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" name="firstName" required>
                </div>
                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" name="lastName" required>
                </div>
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="contactNo">Contact No.</label>
                    <input type="text" id="contactNo" name="contactNo" required>
                </div>
                <div class="form-group">
                    <label for="dob">Date of Birth</label>
                    <input type="date" id="dob" name="dob" required>
                </div>
                <div class="form-group">
                    <label for="zipCode">Zip Code</label>
                    <input type="text" id="zipCode" name="zipCode" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required>
                </div>
                <div class="button-group">
                    <button type="submit">Create Account</button>
                    <button type="button" onclick="location.href='/login'">Already Have An Account</button>
                </div>
            </form>
            
        </div>
    </div>
     <!-- Google Translate -->
 <div class="gtranslate_wrapper"></div>

 <script>
   window.gtranslateSettings = {
     default_language: "en",
     detect_browser_language: true,
     wrapper_selector: ".gtranslate_wrapper",
   };
 </script>

 <script
   src="https://cdn.gtranslate.net/widgets/latest/float.js"
   defer
 ></script>
</body>
</html>
